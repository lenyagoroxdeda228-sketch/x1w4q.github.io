<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="color-scheme" content="dark light"/>
  <title>x1w4q</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <style>
    :root, [data-theme="dark"] {
      --c-primary:              #D0BCFF;
      --c-on-primary:           #381E72;
      --c-primary-container:    #4F378B;
      --c-on-primary-container: #EADDFF;
      --c-secondary:            #CCC2DC;
      --c-secondary-container:  #4A4458;
      --c-on-secondary-container:#E8DEF8;
      --c-tertiary:             #EFB8C8;
      --c-surface:              #141218;
      --c-on-surface:           #E6E1E5;
      --c-on-surface-variant:   #CAC4D0;
      --c-surface-container-low:   #1D1B20;
      --c-surface-container:       #211F26;
      --c-surface-container-high:  #2B2930;
      --c-outline:              #938F99;
      --c-outline-variant:      #49454F;
      --c-shadow: rgba(0,0,0,.55);
      --e1: rgba(208,188,255,.05);
      --e2: rgba(208,188,255,.08);
      --tiktok:   #69C9D0;
      --telegram: #2AABEE;
      --lyrics:   #CE93D8;
    }
    [data-theme="light"] {
      --c-primary:              #6750A4;
      --c-on-primary:           #FFFFFF;
      --c-primary-container:    #EADDFF;
      --c-on-primary-container: #21005D;
      --c-secondary:            #625B71;
      --c-secondary-container:  #E8DEF8;
      --c-on-secondary-container:#1D192B;
      --c-tertiary:             #7D5260;
      --c-surface:              #FFFBFE;
      --c-on-surface:           #1C1B1F;
      --c-on-surface-variant:   #49454F;
      --c-surface-container-low:   #F7F2FA;
      --c-surface-container:       #F3EDF7;
      --c-surface-container-high:  #ECE6F0;
      --c-outline:              #79747E;
      --c-outline-variant:      #CAC4D0;
      --c-shadow: rgba(0,0,0,.15);
      --e1: rgba(103,80,164,.05);
      --e2: rgba(103,80,164,.08);
      --tiktok:   #010101;
      --telegram: #0088CC;
      --lyrics:   #9C27B0;
    }
    :root {
      --r-md: 12px; --r-xl: 28px; --r-full: 9999px;
      --ease-std:   cubic-bezier(.2,0,0,1);
      --ease-decel: cubic-bezier(.05,.7,.1,1);
      --ease-accel: cubic-bezier(.3,0,.8,.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html {
      font-family: 'Google Sans', Roboto, system-ui, sans-serif;
      background: var(--c-surface); color: var(--c-on-surface);
      -webkit-font-smoothing: antialiased;
      transition: background .3s var(--ease-std), color .3s var(--ease-std);
    }
    body {
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      padding: calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 48px);
    }

    /* ── Preloader ── */
    #preloader {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--c-surface);
      display: flex; align-items: center; justify-content: center;
      transition: opacity .4s var(--ease-accel), transform .4s var(--ease-accel);
    }
    #preloader.out { opacity: 0; transform: scale(.97); pointer-events: none; }
    #md3-canvas { display: block; }

    /* ── Theme button ── */
    #theme-btn {
      position: fixed; top: calc(env(safe-area-inset-top,0px) + 12px); right: 16px;
      z-index: 200; width: 48px; height: 48px; border-radius: var(--r-full);
      border: none; cursor: pointer;
      background: var(--c-surface-container-high); color: var(--c-on-surface-variant);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      box-shadow: 0 1px 3px var(--c-shadow), inset 0 0 0 9999px var(--e1);
      transition: background .25s var(--ease-std), box-shadow .25s var(--ease-std), transform .15s var(--ease-std);
    }
    #theme-btn:hover  { box-shadow: 0 2px 8px var(--c-shadow), inset 0 0 0 9999px var(--e2); }
    #theme-btn:active { transform: scale(.9); }
    #theme-btn:focus-visible { outline: 3px solid var(--c-primary); outline-offset: 2px; }
    #theme-btn .ms {
      font-size: 22px;
      font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
      transition: transform .3s var(--ease-std), opacity .2s var(--ease-std);
    }

    /* ── Layout ── */
    main { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

    /* ── Header ── */
    .profile-header {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 48px 0 36px;
      opacity: 0; transform: translateY(18px);
      transition: opacity .5s var(--ease-decel), transform .5s var(--ease-decel);
    }
    .profile-header.in { opacity: 1; transform: none; }
    .avatar {
      width: 88px; height: 88px; border-radius: var(--r-full);
      background: var(--c-primary-container); color: var(--c-on-primary-container);
      font-family: 'Google Sans Display', sans-serif; font-size: 36px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; user-select: none;
      box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15), inset 0 0 0 9999px var(--e2);
      outline: 1.5px solid var(--c-outline-variant); outline-offset: 1px;
    }
    .profile-name {
      font-family: 'Google Sans Display', sans-serif;
      font-size: 26px; font-weight: 700; line-height: 1.2; color: var(--c-on-surface);
    }
    .profile-status {
      font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: .25px;
      color: var(--c-on-surface-variant);
    }

    /* ── Cards ── */
    .links-list { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .link-card {
      position: relative; display: flex; align-items: center; gap: 14px;
      padding: 16px 20px 16px 16px;
      background: var(--c-surface-container-low); border-radius: var(--r-xl);
      text-decoration: none; overflow: hidden; cursor: pointer;
      box-shadow: 0 1px 2px var(--c-shadow), 0 1px 3px 1px rgba(0,0,0,.07), inset 0 0 0 9999px var(--e1);
      opacity: 0; transform: translateY(22px) scale(.985);
      transition: opacity .45s var(--ease-decel), transform .45s var(--ease-decel), box-shadow .25s var(--ease-std);
    }
    .link-card.in { opacity: 1; transform: none; }
    .link-card::before {
      content: ''; position: absolute; inset: 0;
      background: var(--c-on-surface); opacity: 0; border-radius: inherit;
      transition: opacity .15s var(--ease-std); pointer-events: none;
    }
    .link-card:hover { box-shadow: 0 2px 6px var(--c-shadow), 0 1px 10px 1px rgba(0,0,0,.08), inset 0 0 0 9999px var(--e2); transform: translateY(-2px) !important; }
    .link-card:hover::before   { opacity: .08; }
    .link-card:active::before  { opacity: .12; }
    .link-card:active          { transform: scale(.98) !important; }
    .link-card:focus-visible   { outline: 3px solid var(--c-primary); outline-offset: 2px; }
    .card-icon {
      flex-shrink: 0; width: 50px; height: 50px; border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon .ms { font-size: 24px; font-variation-settings: 'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }
    .card--tiktok  .card-icon { background: rgba(105,201,208,.13); color: var(--tiktok); }
    .card--tg      .card-icon { background: rgba(42,171,238,.13);  color: var(--telegram); }
    .card--channel .card-icon { background: rgba(42,171,238,.09);  color: var(--telegram); }
    .card--lyrics  .card-icon { background: rgba(206,147,216,.13); color: var(--lyrics); }
    .card-text { flex: 1; min-width: 0; }
    .card-platform { font-size: 16px; font-weight: 600; line-height: 24px; color: var(--c-on-surface); }
    .card-handle   { font-size: 13px; font-weight: 400; line-height: 18px; letter-spacing: .25px; color: var(--c-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-arrow .ms {
      font-size: 20px; font-variation-settings: 'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;
      color: var(--c-on-surface-variant);
      transition: transform .22s var(--ease-std), color .2s var(--ease-std);
    }
    .link-card:hover .card-arrow .ms { transform: translateX(4px); color: var(--c-primary); }

    /* ── Ripple ── */
    .ripple {
      position: absolute; border-radius: 50%; transform: scale(0);
      animation: ripple .5s var(--ease-decel) forwards;
      pointer-events: none; background: var(--c-on-surface); opacity: .1;
    }
    @keyframes ripple { to { transform: scale(4.5); opacity: 0; } }

    /* ── Footer ── */
    footer { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transition: opacity .5s var(--ease-decel); }
    footer.in { opacity: 1; }
    .footer-text { font-size: 12px; letter-spacing: .4px; color: var(--c-outline); }
    .footer-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 12px; border-radius: var(--r-full); border: 1px solid var(--c-outline-variant); font-size: 11px; font-weight: 500; color: var(--c-on-surface-variant); letter-spacing: .5px; }

    /* ── Utils ── */
    .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; -webkit-font-smoothing: antialiased; user-select: none; }
    /* ══ MD3 EXPRESSIVE BACKGROUND SHAPES ══ */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
    }
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(0px);
      opacity: 0;
      animation: bgFloat linear infinite;
      will-change: transform, opacity;
    }
    /* Each shape gets unique position/size/color via inline style + nth */
    @keyframes bgFloat {
      0%   { transform: translateY(0px) rotate(0deg) scale(1);   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(-120px) rotate(120deg) scale(1.15); opacity: 0; }
    }

    /* ══ AVATAR GLOW + HOVER SPRING ══ */
    .avatar {
      cursor: default;
      transition:
        background .3s var(--ease-std),
        color .3s var(--ease-std),
        box-shadow .4s var(--ease-std),
        transform .5s cubic-bezier(.34,1.56,.64,1);
    }
    .avatar:hover {
      transform: scale(1.08);
      box-shadow:
        0 0 0 4px var(--c-primary-container),
        0 0 32px 8px rgba(208,188,255,.25),
        0 4px 16px rgba(0,0,0,.4),
        inset 0 0 0 9999px var(--e2);
    }
    [data-theme="light"] .avatar:hover {
      box-shadow:
        0 0 0 4px var(--c-primary-container),
        0 0 32px 8px rgba(103,80,164,.18),
        0 4px 16px rgba(0,0,0,.15),
        inset 0 0 0 9999px var(--e2);
    }

    /* ══ CARD GLOW ON HOVER ══ */
    .link-card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity .3s var(--ease-std);
      pointer-events: none;
    }
    .card--tiktok::after  { box-shadow: inset 0 0 0 1px rgba(105,201,208,.4); }
    .card--tg::after      { box-shadow: inset 0 0 0 1px rgba(42,171,238,.4); }
    .card--channel::after { box-shadow: inset 0 0 0 1px rgba(42,171,238,.3); }
    .card--lyrics::after  { box-shadow: inset 0 0 0 1px rgba(206,147,216,.4); }
    .link-card:hover::after { opacity: 1; }

    /* Card tilt — applied via JS */
    .link-card {
      transform-style: preserve-3d;
      transform-origin: center center;
    }

    /* ══ ICON PULSE ON HOVER ══ */
    .card-icon {
      transition: background .2s var(--ease-std), transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .link-card:hover .card-icon { transform: scale(1.12) rotate(-4deg); }
    .link-card:active .card-icon { transform: scale(.95) rotate(0deg); }

    /* ══ PROFILE NAME SHIMMER ══ */
    .profile-name {
      background: linear-gradient(
        90deg,
        var(--c-on-surface) 0%,
        var(--c-primary) 50%,
        var(--c-on-surface) 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* ══ STATUS DOTS PULSE ══ */
    .dot-pulse {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--c-primary);
      margin: 0 2px;
      vertical-align: middle;
      animation: dotPulse 2s ease-in-out infinite;
    }
    .dot-pulse:nth-child(2) { animation-delay: .2s; background: var(--c-secondary); }
    .dot-pulse:nth-child(3) { animation-delay: .4s; background: var(--c-tertiary); }
    @keyframes dotPulse {
      0%,100% { transform: scale(1); opacity: .5; }
      50%     { transform: scale(1.5); opacity: 1; }
    }

    /* ══ FOOTER SPARKLE ══ */
    #footer .ms {
      animation: sparkle 3s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%,100% { transform: scale(1) rotate(0deg); opacity: .7; }
      50%     { transform: scale(1.3) rotate(20deg); opacity: 1; }
    }

    main { position: relative; z-index: 1; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    @media (min-width: 600px) { main { max-width: 440px; } .profile-header { padding-top: 64px; } }
  </style>
</head>

/* ── Ripple ── */
document.querySelectorAll('.link-card').forEach(function(card){
  card.addEventListener('pointerdown',function(e){
    var r=card.getBoundingClientRect(), d=Math.max(r.width,r.height)*1.8;
    var el=document.createElement('span'); el.className='ripple';
    el.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
    card.appendChild(el); el.addEventListener('animationend',function(){el.remove();});
  });
});

/* ── Reveal ── */
function reveal(){
  var hdr=document.querySelector('.profile-header'), cards=document.querySelectorAll('.link-card'), ftr=document.getElementById('footer');
  setTimeout(function(){hdr.classList.add('in');},60);
  cards.forEach(function(c,i){setTimeout(function(){c.classList.add('in');},200+i*110);});
  setTimeout(function(){ftr.classList.add('in');},200+cards.length*110+80);
}

    '<svg viewBox="0 0 100 100"><path d="M50 8L92 50L50 92L8 50Z" fill="currentColor" style="border-radius:8px"/></svg>',
    // star-ish
    '<svg viewBox="0 0 100 100"><path d="M50 5C55 30 75 35 95 30C80 45 85 68 95 85C75 75 58 82 50 95C42 82 25 75 5 85C15 68 20 45 5 30C25 35 45 30 50 5Z" fill="currentColor"/></svg>',
  ];

  var COLORS_DARK  = ['rgba(208,188,255,.07)','rgba(204,194,220,.05)','rgba(239,184,200,.06)','rgba(208,188,255,.05)'];
  var COLORS_LIGHT = ['rgba(103,80,164,.06)','rgba(98,91,113,.04)','rgba(125,82,96,.05)','rgba(103,80,164,.04)'];

  function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

  function spawn() {
    var colors = isDark() ? COLORS_DARK : COLORS_LIGHT;
    var el = document.createElement('div');
    el.className = 'bg-shape';

    var size = 40 + Math.random() * 120;
    var x    = Math.random() * 110 - 5;
    var y    = 60 + Math.random() * 60; // start from bottom half
    var dur  = 8 + Math.random() * 12;
    var delay= Math.random() * -dur;
    var color= colors[Math.floor(Math.random() * colors.length)];
    var shape= SHAPES_SVG[Math.floor(Math.random() * SHAPES_SVG.length)];

    el.style.cssText = [
      'width:' + size + 'px',
      'height:' + size + 'px',
      'left:' + x + '%',
      'top:' + y + '%',
      'color:' + color,
      'animation-duration:' + dur + 's',
      'animation-delay:' + delay + 's',
    ].join(';');
    el.innerHTML = shape;
    el.querySelector('svg').style.width = '100%';
    el.querySelector('svg').style.height = '100%';

    bg.appendChild(el);

    // Remove after a few cycles
    setTimeout(function () { if (el.parentNode) el.remove(); }, (dur + Math.abs(delay) + 2) * 1000);
  }

  // Spawn initial batch
  for (var i = 0; i < 8; i++) spawn();
  // Keep spawning
  setInterval(spawn, 2500);
})();

/* ══ CARD 3D TILT (MD3 Expressive interactive motion) ══ */
document.querySelectorAll('.link-card').forEach(function (card) {
  var MAX_TILT = 6; // degrees
  var rect;

  card.addEventListener('pointerenter', function () {
    rect = card.getBoundingClientRect();
  });

  card.addEventListener('pointermove', function (e) {
    if (!rect) rect = card.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width  - 0.5;  // -0.5 → 0.5
    var y = (e.clientY - rect.top)  / rect.height - 0.5;
    var rotX = -y * MAX_TILT;
    var rotY =  x * MAX_TILT;
    card.style.transform = 'translateY(-2px) perspective(600px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
  });

  card.addEventListener('pointerleave', function () {
    card.style.transform = '';
    rect = null;
  });

  card.addEventListener('pointerdown', function () {
    card.style.transform = 'scale(.98)';
  });
});
</script>
